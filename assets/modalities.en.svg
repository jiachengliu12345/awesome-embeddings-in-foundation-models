<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1000" viewBox="0 0 1160 1000" lang="en" role="img" aria-labelledby="title desc"><title id="title">Continuous projections, codec codebooks, and downstream tables</title><desc id="desc">Separate continuous mappings, codec quantization, and language-model lookup.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#267e77"/></marker></defs><rect width="1160" height="1000" fill="#f5f4ed"/><g font-family="system-ui, sans-serif"><text x="36" y="50" font-size="29" fill="#15383a" font-weight="650">Continuous projections, codec codebooks, and downstream tables</text><text x="36" y="84" font-size="16" fill="#526a67" font-weight="400">Separate continuous mappings, codec quantization, and language-model lookup.</text><text x="36" y="125" font-size="20" fill="#15383a" font-weight="650">Visual input · SigLIP 2 and Gemma projection reference</text><rect x="36" y="145" width="245" height="76" rx="10" fill="#eef5ee" stroke="#a5b9b1"/><text x="50" y="173" font-size="16" fill="#15383a" font-weight="400">SigLIP 2</text><text x="50" y="197" font-size="16" fill="#15383a" font-weight="400">continuous patches</text><path d="M284 183 H310" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="317" y="145" width="245" height="76" rx="10" fill="#eef5ee" stroke="#a5b9b1"/><text x="331" y="173" font-size="16" fill="#15383a" font-weight="400">Learned patch map</text><text x="331" y="197" font-size="16" fill="#15383a" font-weight="400">+ position → encoder</text><rect x="598" y="145" width="245" height="76" rx="10" fill="#eef5ee" stroke="#a5b9b1"/><text x="612" y="173" font-size="16" fill="#15383a" font-weight="400">Gemma vision features</text><path d="M846 183 H872" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="879" y="145" width="245" height="76" rx="10" fill="#eef5ee" stroke="#a5b9b1"/><text x="893" y="173" font-size="16" fill="#15383a" font-weight="400">Normalize + project</text><text x="893" y="197" font-size="16" fill="#15383a" font-weight="400">to LM hidden width</text><text x="36" y="253" font-size="15" fill="#536966" font-weight="400">Left: SigLIP 2 patch input. Right: the Gemma 4 vision-to-language interface.</text><text x="36" y="315" font-size="20" fill="#15383a" font-weight="650">Audio codec · Mimi codebook</text><rect x="36" y="335" width="245" height="76" rx="10" fill="#eef5ee" stroke="#a5b9b1"/><text x="50" y="363" font-size="16" fill="#15383a" font-weight="400">Audio encoder features</text><path d="M284 373 H310" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="317" y="335" width="245" height="76" rx="10" fill="#eef5ee" stroke="#a5b9b1"/><text x="331" y="363" font-size="16" fill="#15383a" font-weight="400">Residual quantization</text><text x="331" y="387" font-size="16" fill="#15383a" font-weight="400">EMA centroids</text><path d="M565 373 H591" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="598" y="335" width="245" height="76" rx="10" fill="#eef5ee" stroke="#a5b9b1"/><text x="612" y="363" font-size="16" fill="#15383a" font-weight="400">Discrete code IDs</text><path d="M846 373 H872" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="879" y="335" width="245" height="76" rx="10" fill="#eef5ee" stroke="#a5b9b1"/><text x="893" y="363" font-size="16" fill="#15383a" font-weight="400">Codec decode lookup</text><text x="893" y="387" font-size="16" fill="#15383a" font-weight="400">reconstruct features</text><text x="36" y="443" font-size="15" fill="#536966" font-weight="400">Codebooks serve acoustic quantization/reconstruction. Mimi stores EMA state as buffers, separate from LM parameters.</text><text x="36" y="505" font-size="20" fill="#15383a" font-weight="650">Downstream language model · Moshi audio token tables</text><rect x="36" y="525" width="245" height="76" rx="10" fill="#eef5ee" stroke="#a5b9b1"/><text x="50" y="553" font-size="16" fill="#15383a" font-weight="400">Discrete code IDs</text><text x="50" y="577" font-size="16" fill="#15383a" font-weight="400">from the codec</text><path d="M284 563 H310" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="317" y="525" width="245" height="76" rx="10" fill="#eef5ee" stroke="#a5b9b1"/><text x="331" y="553" font-size="16" fill="#15383a" font-weight="400">LM embedding table</text><text x="331" y="577" font-size="16" fill="#15383a" font-weight="400">per codebook stream</text><path d="M565 563 H591" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="598" y="525" width="245" height="76" rx="10" fill="#eef5ee" stroke="#a5b9b1"/><text x="612" y="553" font-size="16" fill="#15383a" font-weight="400">Combine with text</text><text x="612" y="577" font-size="16" fill="#15383a" font-weight="400">representation</text><path d="M846 563 H872" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="879" y="525" width="245" height="76" rx="10" fill="#eef5ee" stroke="#a5b9b1"/><text x="893" y="553" font-size="16" fill="#15383a" font-weight="400">Language model stack</text><text x="36" y="633" font-size="15" fill="#536966" font-weight="400">A shared ID interface does not imply shared table weights. Codec width c and LM hidden width d may differ.</text><text x="36" y="695" font-size="20" fill="#15383a" font-weight="650">Contrast · FSQ in Cosmos Tokenizer</text><rect x="36" y="715" width="245" height="76" rx="10" fill="#eef5ee" stroke="#a5b9b1"/><text x="50" y="743" font-size="16" fill="#15383a" font-weight="400">Continuous features</text><path d="M284 753 H310" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="317" y="715" width="245" height="76" rx="10" fill="#eef5ee" stroke="#a5b9b1"/><text x="331" y="743" font-size="16" fill="#15383a" font-weight="400">Optional learned map</text><text x="331" y="767" font-size="16" fill="#15383a" font-weight="400">fixed scalar levels</text><path d="M565 753 H591" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="598" y="715" width="245" height="76" rx="10" fill="#eef5ee" stroke="#a5b9b1"/><text x="612" y="743" font-size="16" fill="#15383a" font-weight="400">Quantized coordinates</text><text x="612" y="767" font-size="16" fill="#15383a" font-weight="400">↔ code ID</text><rect x="879" y="715" width="245" height="76" rx="10" fill="#eef5ee" stroke="#a5b9b1"/><text x="893" y="743" font-size="16" fill="#15383a" font-weight="400">Stored separately:</text><text x="893" y="767" font-size="16" fill="#15383a" font-weight="400">implicit codebook buffer</text><text x="36" y="823" font-size="15" fill="#536966" font-weight="400">Fixed scalar levels, with optional learned projections. The implementation also allocates a codebook buffer.</text><text x="36" y="921" font-size="14" fill="#536966" font-weight="400">Sources: SigLIP 2 embeddings; Gemma 4 encode_vision; Mimi core_vq.py; Moshi lm.py; Cosmos FSQuantizer.</text><text x="36" y="943" font-size="14" fill="#536966" font-weight="400">Example modules are shown separately; arrows show data flow. Details and versions: SOURCES.</text></g></svg>
