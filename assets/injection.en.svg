<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="930" viewBox="0 0 1160 930" lang="en" role="img" aria-labelledby="title desc"><title id="title">Where do embedding vectors enter computation?</title><desc id="desc">Four designs, compared by lookup key and injection site. Arrows show computation.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#267e77"/></marker></defs><rect width="1160" height="930" fill="#f5f4ed"/><g font-family="system-ui, sans-serif"><text x="36" y="50" font-size="29" fill="#15383a" font-weight="650">Where do embedding vectors enter computation?</text><text x="36" y="84" font-size="16" fill="#526a67" font-weight="400">Four designs, compared by lookup key and injection site. Arrows show computation.</text><text x="36" y="120" font-size="20" fill="#15383a" font-weight="650">Ordinary token embeddings</text><rect x="36" y="138" width="245" height="76" rx="10" fill="#e7f1eb" stroke="#a5b9b1"/><text x="50" y="166" font-size="16" fill="#15383a" font-weight="400">token ID</text><path d="M284 176 H310" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="317" y="138" width="245" height="76" rx="10" fill="#e7f1eb" stroke="#a5b9b1"/><text x="331" y="166" font-size="16" fill="#15383a" font-weight="400">Lookup E[token]</text><text x="331" y="190" font-size="16" fill="#15383a" font-weight="400">V × d</text><path d="M565 176 H591" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="598" y="138" width="245" height="76" rx="10" fill="#fffdfa" stroke="#a5b9b1"/><text x="612" y="166" font-size="16" fill="#15383a" font-weight="400">Transformer</text><text x="612" y="190" font-size="16" fill="#15383a" font-weight="400">attention + FFN</text><path d="M846 176 H872" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="879" y="138" width="245" height="76" rx="10" fill="#fffdfa" stroke="#a5b9b1"/><text x="893" y="166" font-size="16" fill="#15383a" font-weight="400">Output logits</text><text x="893" y="190" font-size="16" fill="#15383a" font-weight="400">May reuse Eᵀ</text><text x="36" y="244" font-size="15" fill="#536966" font-weight="400">Input lookup precedes the stack; tying the output matrix does not remove its projection.</text><text x="36" y="307" font-size="20" fill="#15383a" font-weight="650">Per-Layer Embeddings (PLE) · Gemma 4</text><rect x="36" y="325" width="245" height="76" rx="10" fill="#e7f1eb" stroke="#a5b9b1"/><text x="50" y="353" font-size="16" fill="#15383a" font-weight="400">Token ID +</text><text x="50" y="377" font-size="16" fill="#15383a" font-weight="400">ordinary token vector</text><path d="M284 363 H310" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="317" y="325" width="245" height="76" rx="10" fill="#e7f1eb" stroke="#a5b9b1"/><text x="331" y="353" font-size="16" fill="#15383a" font-weight="400">PLE lookup +</text><text x="331" y="377" font-size="16" fill="#15383a" font-weight="400">model projection/norm</text><path d="M565 363 H591" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="598" y="325" width="245" height="76" rx="10" fill="#fffdfa" stroke="#a5b9b1"/><text x="612" y="353" font-size="16" fill="#15383a" font-weight="400">After attention + FFN</text><text x="612" y="377" font-size="16" fill="#15383a" font-weight="400">hidden-state gate</text><path d="M846 363 H872" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="879" y="325" width="245" height="76" rx="10" fill="#fffdfa" stroke="#a5b9b1"/><text x="893" y="353" font-size="16" fill="#15383a" font-weight="400">Layer projection/norm</text><text x="893" y="377" font-size="16" fill="#15383a" font-weight="400">extra residual update</text><text x="36" y="431" font-size="15" fill="#536966" font-weight="400">Prepare [L,dₚ] inputs first. Gates still depend on the current hidden state. Storage formula counts the table only.</text><text x="36" y="494" font-size="20" fill="#15383a" font-weight="650">SCONE · contextual input extension</text><rect x="36" y="512" width="245" height="76" rx="10" fill="#e7f1eb" stroke="#a5b9b1"/><text x="50" y="540" font-size="16" fill="#15383a" font-weight="400">Contextual n-gram</text><text x="50" y="564" font-size="16" fill="#15383a" font-weight="400">frequent-item match</text><path d="M284 550 H310" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="317" y="512" width="245" height="76" rx="10" fill="#e7f1eb" stroke="#a5b9b1"/><text x="331" y="540" font-size="16" fill="#15383a" font-weight="400">Query precomputed</text><text x="331" y="564" font-size="16" fill="#15383a" font-weight="400">off-accelerator cache</text><path d="M565 550 H591" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="598" y="512" width="245" height="76" rx="10" fill="#fffdfa" stroke="#a5b9b1"/><text x="612" y="540" font-size="16" fill="#15383a" font-weight="400">Contextual input</text><text x="612" y="564" font-size="16" fill="#15383a" font-weight="400">to language backbone</text><path d="M846 550 H872" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="879" y="512" width="245" height="76" rx="10" fill="#fffdfa" stroke="#a5b9b1"/><text x="893" y="540" font-size="16" fill="#15383a" font-weight="400">Output logits</text><text x="893" y="564" font-size="16" fill="#15383a" font-weight="400">Vocabulary unchanged</text><text x="36" y="618" font-size="15" fill="#536966" font-weight="400">A separate learner is trained before vectors are cached; training and transfer costs still count.</text><text x="36" y="681" font-size="20" fill="#15383a" font-weight="650">Engram · memory at selected internal layers</text><rect x="36" y="699" width="245" height="76" rx="10" fill="#e7f1eb" stroke="#a5b9b1"/><text x="50" y="727" font-size="16" fill="#15383a" font-weight="400">Normalized n-grams</text><text x="50" y="751" font-size="16" fill="#15383a" font-weight="400">multi-head hashes</text><path d="M284 737 H310" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="317" y="699" width="245" height="76" rx="10" fill="#e7f1eb" stroke="#a5b9b1"/><text x="331" y="727" font-size="16" fill="#15383a" font-weight="400">Multi-head lookup</text><text x="331" y="751" font-size="16" fill="#15383a" font-weight="400">concatenate vectors</text><path d="M565 737 H591" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="598" y="699" width="245" height="76" rx="10" fill="#fffdfa" stroke="#a5b9b1"/><text x="612" y="727" font-size="16" fill="#15383a" font-weight="400">Key/value projection</text><text x="612" y="751" font-size="16" fill="#15383a" font-weight="400">hidden-state gate/conv</text><path d="M846 737 H872" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="879" y="699" width="245" height="76" rx="10" fill="#fffdfa" stroke="#a5b9b1"/><text x="893" y="727" font-size="16" fill="#15383a" font-weight="400">Add to residual</text><text x="893" y="751" font-size="16" fill="#15383a" font-weight="400">before attention in demo</text><text x="36" y="805" font-size="15" fill="#536966" font-weight="400">The architecture demo omits or mocks attention, MoE, and hyper-connections.</text><text x="36" y="891" font-size="14" fill="#536966" font-weight="400">Sources: Gemma 4 Embedder &amp; Block; SCONE arXiv:2502.01637v3; Engram demo.</text><text x="36" y="913" font-size="14" fill="#536966" font-weight="400">Some normalization, positional encoding, and caches omitted. See COMPARISON / SOURCES for conditions and versions.</text></g></svg>
