<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1000" viewBox="0 0 1160 1000" lang="zh-CN" role="img" aria-labelledby="title desc"><title id="title">连续投影、codec 码本和下游 token 表</title><desc id="desc">区分连续映射、codec 量化与语言模型查表。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#267e77"/></marker></defs><rect width="1160" height="1000" fill="#f5f4ed"/><g font-family="system-ui, sans-serif"><text x="36" y="50" font-size="29" fill="#15383a" font-weight="650">连续投影、codec 码本和下游 token 表</text><text x="36" y="84" font-size="16" fill="#526a67" font-weight="400">区分连续映射、codec 量化与语言模型查表。</text><text x="36" y="125" font-size="20" fill="#15383a" font-weight="650">视觉输入 · SigLIP 2 与 Gemma 投影对照</text><rect x="36" y="145" width="245" height="76" rx="10" fill="#eef5ee" stroke="#a5b9b1"/><text x="50" y="173" font-size="16" fill="#15383a" font-weight="400">SigLIP 2</text><text x="50" y="197" font-size="16" fill="#15383a" font-weight="400">图像块连续值</text><path d="M284 183 H310" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="317" y="145" width="245" height="76" rx="10" fill="#eef5ee" stroke="#a5b9b1"/><text x="331" y="173" font-size="16" fill="#15383a" font-weight="400">学习 patch 投影</text><text x="331" y="197" font-size="16" fill="#15383a" font-weight="400">另加位置表 → 编码器</text><rect x="598" y="145" width="245" height="76" rx="10" fill="#eef5ee" stroke="#a5b9b1"/><text x="612" y="173" font-size="16" fill="#15383a" font-weight="400">Gemma 视觉特征</text><path d="M846 183 H872" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="879" y="145" width="245" height="76" rx="10" fill="#eef5ee" stroke="#a5b9b1"/><text x="893" y="173" font-size="16" fill="#15383a" font-weight="400">归一化 ＋ 投影</text><text x="893" y="197" font-size="16" fill="#15383a" font-weight="400">映射到 LM 维度</text><text x="36" y="253" font-size="15" fill="#536966" font-weight="400">左侧为 SigLIP 2 的图像块输入；右侧为 Gemma 4 的视觉到语言模态接口。</text><text x="36" y="315" font-size="20" fill="#15383a" font-weight="650">音频 codec · Mimi 码本</text><rect x="36" y="335" width="245" height="76" rx="10" fill="#eef5ee" stroke="#a5b9b1"/><text x="50" y="363" font-size="16" fill="#15383a" font-weight="400">音频编码器特征</text><path d="M284 373 H310" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="317" y="335" width="245" height="76" rx="10" fill="#eef5ee" stroke="#a5b9b1"/><text x="331" y="363" font-size="16" fill="#15383a" font-weight="400">量化／残差码本</text><text x="331" y="387" font-size="16" fill="#15383a" font-weight="400">EMA 更新中心</text><path d="M565 373 H591" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="598" y="335" width="245" height="76" rx="10" fill="#eef5ee" stroke="#a5b9b1"/><text x="612" y="363" font-size="16" fill="#15383a" font-weight="400">离散 code ID</text><path d="M846 373 H872" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="879" y="335" width="245" height="76" rx="10" fill="#eef5ee" stroke="#a5b9b1"/><text x="893" y="363" font-size="16" fill="#15383a" font-weight="400">codec 解码查表</text><text x="893" y="387" font-size="16" fill="#15383a" font-weight="400">重建音频特征</text><text x="36" y="443" font-size="15" fill="#536966" font-weight="400">码本负责声学量化／重建；Mimi 的 EMA 状态存为缓冲区，不等于 LM 词表参数。</text><text x="36" y="505" font-size="20" fill="#15383a" font-weight="650">下游语言模型 · Moshi 音频 token 表</text><rect x="36" y="525" width="245" height="76" rx="10" fill="#eef5ee" stroke="#a5b9b1"/><text x="50" y="553" font-size="16" fill="#15383a" font-weight="400">来自 codec 的</text><text x="50" y="577" font-size="16" fill="#15383a" font-weight="400">离散 code ID</text><path d="M284 563 H310" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="317" y="525" width="245" height="76" rx="10" fill="#eef5ee" stroke="#a5b9b1"/><text x="331" y="553" font-size="16" fill="#15383a" font-weight="400">每个码本流的</text><text x="331" y="577" font-size="16" fill="#15383a" font-weight="400">LM 嵌入表</text><path d="M565 563 H591" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="598" y="525" width="245" height="76" rx="10" fill="#eef5ee" stroke="#a5b9b1"/><text x="612" y="553" font-size="16" fill="#15383a" font-weight="400">与文本表示组合</text><path d="M846 563 H872" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="879" y="525" width="245" height="76" rx="10" fill="#eef5ee" stroke="#a5b9b1"/><text x="893" y="553" font-size="16" fill="#15383a" font-weight="400">语言模型主干</text><text x="36" y="633" font-size="15" fill="#536966" font-weight="400">相同的 ID 接口不意味着共用同一张表；codec 维度 c 与 LM 隐藏维度 d 可以不同。</text><text x="36" y="695" font-size="20" fill="#15383a" font-weight="650">对照 · Cosmos 的 FSQ</text><rect x="36" y="715" width="245" height="76" rx="10" fill="#eef5ee" stroke="#a5b9b1"/><text x="50" y="743" font-size="16" fill="#15383a" font-weight="400">连续特征</text><path d="M284 753 H310" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="317" y="715" width="245" height="76" rx="10" fill="#eef5ee" stroke="#a5b9b1"/><text x="331" y="743" font-size="16" fill="#15383a" font-weight="400">可选学习投影</text><text x="331" y="767" font-size="16" fill="#15383a" font-weight="400">固定标量 levels</text><path d="M565 753 H591" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="598" y="715" width="245" height="76" rx="10" fill="#eef5ee" stroke="#a5b9b1"/><text x="612" y="743" font-size="16" fill="#15383a" font-weight="400">量化坐标</text><text x="612" y="767" font-size="16" fill="#15383a" font-weight="400">与 code ID 互转</text><rect x="879" y="715" width="245" height="76" rx="10" fill="#eef5ee" stroke="#a5b9b1"/><text x="893" y="743" font-size="16" fill="#15383a" font-weight="400">实现另存</text><text x="893" y="767" font-size="16" fill="#15383a" font-weight="400">隐式码本缓冲区</text><text x="36" y="823" font-size="15" fill="#536966" font-weight="400">采用固定标量级别，可带学习投影；该实现还分配了隐式码本缓冲区。</text><text x="36" y="921" font-size="14" fill="#536966" font-weight="400">Sources: SigLIP 2 embeddings; Gemma 4 encode_vision; Mimi core_vq.py; Moshi lm.py; Cosmos FSQuantizer.</text><text x="36" y="943" font-size="14" fill="#536966" font-weight="400">不同示例模块分别绘制，箭头表示数据流。详细版本与来源见 SOURCES。</text></g></svg>
