<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="930" viewBox="0 0 1160 930" lang="zh-CN" role="img" aria-labelledby="title desc"><title id="title">嵌入向量在哪里进入计算？</title><desc id="desc">按查表键与注入位置对照四种设计；箭头表示计算路径。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#267e77"/></marker></defs><rect width="1160" height="930" fill="#f5f4ed"/><g font-family="system-ui, sans-serif"><text x="36" y="50" font-size="29" fill="#15383a" font-weight="650">嵌入向量在哪里进入计算？</text><text x="36" y="84" font-size="16" fill="#526a67" font-weight="400">按查表键与注入位置对照四种设计；箭头表示计算路径。</text><text x="36" y="120" font-size="20" fill="#15383a" font-weight="650">普通 token 嵌入</text><rect x="36" y="138" width="245" height="76" rx="10" fill="#e7f1eb" stroke="#a5b9b1"/><text x="50" y="166" font-size="16" fill="#15383a" font-weight="400">token ID</text><path d="M284 176 H310" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="317" y="138" width="245" height="76" rx="10" fill="#e7f1eb" stroke="#a5b9b1"/><text x="331" y="166" font-size="16" fill="#15383a" font-weight="400">查表 E[token]</text><text x="331" y="190" font-size="16" fill="#15383a" font-weight="400">V × d</text><path d="M565 176 H591" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="598" y="138" width="245" height="76" rx="10" fill="#fffdfa" stroke="#a5b9b1"/><text x="612" y="166" font-size="16" fill="#15383a" font-weight="400">Transformer</text><text x="612" y="190" font-size="16" fill="#15383a" font-weight="400">attention + FFN</text><path d="M846 176 H872" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="879" y="138" width="245" height="76" rx="10" fill="#fffdfa" stroke="#a5b9b1"/><text x="893" y="166" font-size="16" fill="#15383a" font-weight="400">输出 logits</text><text x="893" y="190" font-size="16" fill="#15383a" font-weight="400">可复用 Eᵀ</text><text x="36" y="244" font-size="15" fill="#536966" font-weight="400">输入查表在主干前；输出矩阵共享并不消除输出投影。</text><text x="36" y="307" font-size="20" fill="#15383a" font-weight="650">每层嵌入（PLE）· Gemma 4</text><rect x="36" y="325" width="245" height="76" rx="10" fill="#e7f1eb" stroke="#a5b9b1"/><text x="50" y="353" font-size="16" fill="#15383a" font-weight="400">token ID ＋</text><text x="50" y="377" font-size="16" fill="#15383a" font-weight="400">普通 token 向量</text><path d="M284 363 H310" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="317" y="325" width="245" height="76" rx="10" fill="#e7f1eb" stroke="#a5b9b1"/><text x="331" y="353" font-size="16" fill="#15383a" font-weight="400">PLE 查表 ＋</text><text x="331" y="377" font-size="16" fill="#15383a" font-weight="400">模型投影／归一化</text><path d="M565 363 H591" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="598" y="325" width="245" height="76" rx="10" fill="#fffdfa" stroke="#a5b9b1"/><text x="612" y="353" font-size="16" fill="#15383a" font-weight="400">attention + FFN 后</text><text x="612" y="377" font-size="16" fill="#15383a" font-weight="400">隐藏状态门控</text><path d="M846 363 H872" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="879" y="325" width="245" height="76" rx="10" fill="#fffdfa" stroke="#a5b9b1"/><text x="893" y="353" font-size="16" fill="#15383a" font-weight="400">逐层投影／归一化</text><text x="893" y="377" font-size="16" fill="#15383a" font-weight="400">额外残差更新</text><text x="36" y="431" font-size="15" fill="#536966" font-weight="400">先准备 [L,dₚ] 输入；门控仍依赖当前层隐藏状态。存储公式只统计表。</text><text x="36" y="494" font-size="20" fill="#15383a" font-weight="650">SCONE · 上下文输入扩展</text><rect x="36" y="512" width="245" height="76" rx="10" fill="#e7f1eb" stroke="#a5b9b1"/><text x="50" y="540" font-size="16" fill="#15383a" font-weight="400">上下文 n-gram</text><text x="50" y="564" font-size="16" fill="#15383a" font-weight="400">高频项匹配</text><path d="M284 550 H310" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="317" y="512" width="245" height="76" rx="10" fill="#e7f1eb" stroke="#a5b9b1"/><text x="331" y="540" font-size="16" fill="#15383a" font-weight="400">查询预计算向量</text><text x="331" y="564" font-size="16" fill="#15383a" font-weight="400">加速器外缓存</text><path d="M565 550 H591" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="598" y="512" width="245" height="76" rx="10" fill="#fffdfa" stroke="#a5b9b1"/><text x="612" y="540" font-size="16" fill="#15383a" font-weight="400">上下文输入向量</text><text x="612" y="564" font-size="16" fill="#15383a" font-weight="400">进入语言模型主干</text><path d="M846 550 H872" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="879" y="512" width="245" height="76" rx="10" fill="#fffdfa" stroke="#a5b9b1"/><text x="893" y="540" font-size="16" fill="#15383a" font-weight="400">输出 logits</text><text x="893" y="564" font-size="16" fill="#15383a" font-weight="400">词表不变</text><text x="36" y="618" font-size="15" fill="#536966" font-weight="400">独立学习器先训练，再预计算向量；训练与传输代价仍需计入。</text><text x="36" y="681" font-size="20" fill="#15383a" font-weight="650">Engram · 选定内部层的记忆路径</text><rect x="36" y="699" width="245" height="76" rx="10" fill="#e7f1eb" stroke="#a5b9b1"/><text x="50" y="727" font-size="16" fill="#15383a" font-weight="400">规范化 n-gram</text><text x="50" y="751" font-size="16" fill="#15383a" font-weight="400">多头哈希</text><path d="M284 737 H310" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="317" y="699" width="245" height="76" rx="10" fill="#e7f1eb" stroke="#a5b9b1"/><text x="331" y="727" font-size="16" fill="#15383a" font-weight="400">多头表查找</text><text x="331" y="751" font-size="16" fill="#15383a" font-weight="400">拼接向量</text><path d="M565 737 H591" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="598" y="699" width="245" height="76" rx="10" fill="#fffdfa" stroke="#a5b9b1"/><text x="612" y="727" font-size="16" fill="#15383a" font-weight="400">键值投影 ＋</text><text x="612" y="751" font-size="16" fill="#15383a" font-weight="400">隐藏状态门控／卷积</text><path d="M846 737 H872" stroke="#267e77" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="879" y="699" width="245" height="76" rx="10" fill="#fffdfa" stroke="#a5b9b1"/><text x="893" y="727" font-size="16" fill="#15383a" font-weight="400">加入残差流</text><text x="893" y="751" font-size="16" fill="#15383a" font-weight="400">演示中在 attention 前</text><text x="36" y="805" font-size="15" fill="#536966" font-weight="400">架构演示省略或模拟了 attention、MoE 和超连接组件。</text><text x="36" y="891" font-size="14" fill="#536966" font-weight="400">依据：Gemma 4 Embedder &amp; Block; SCONE arXiv:2502.01637v3; Engram demo.</text><text x="36" y="913" font-size="14" fill="#536966" font-weight="400">省略部分归一化、位置编码和缓存。详细条件与文件版本见 COMPARISON / SOURCES。</text></g></svg>
