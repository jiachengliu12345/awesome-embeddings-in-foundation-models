<svg xmlns="http://www.w3.org/2000/svg" width="420" height="900" viewBox="0 0 420 900" lang="zh-CN" role="img" aria-labelledby="title desc"><title id="title">625 MiB 的表，返回 2 KiB 的向量</title><desc id="desc">token ID 42 选中嵌入表的一行，取出的向量送入 Transformer。固定维度和精度时，增加表行数只改变全表存储量。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#087f72"/></marker></defs><rect width="420" height="900" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans CJK SC,sans-serif" fill="#172b39"><text x="24" y="38" font-size="26" font-weight="700" fill="#172b39" text-anchor="start">625 MiB 的表，</text><text x="24" y="71" font-size="26" font-weight="700" fill="#172b39" text-anchor="start">返回 2 KiB 的向量</text><text x="24" y="111" font-size="18" font-weight="400" fill="#172b39" text-anchor="start">一次输入查表：</text><text x="24" y="136" font-size="18" font-weight="400" fill="#172b39" text-anchor="start">token ID 选中一行送入模型。</text><text x="148" y="177" font-size="18" font-weight="650" fill="#172b39" text-anchor="start">320,000 行 × 1,024 列</text><rect x="148" y="193" width="240" height="34" fill="#f4f6f8" stroke="#d3dce2"/><text x="138" y="216.0" font-size="16" font-weight="400" fill="#63717d" text-anchor="end">…</text><rect x="148" y="227" width="240" height="34" fill="#f4f6f8" stroke="#d3dce2"/><text x="138" y="250.0" font-size="16" font-weight="400" fill="#63717d" text-anchor="end">41</text><rect x="148" y="261" width="240" height="34" rx="3" fill="#dbf4ed" stroke="#087f72" stroke-width="2"/><path d="M208.0 261v34" stroke="#087f72" stroke-opacity=".35"/><path d="M268.0 261v34" stroke="#087f72" stroke-opacity=".35"/><path d="M328.0 261v34" stroke="#087f72" stroke-opacity=".35"/><text x="178.0" y="284.0" font-size="16" font-weight="400" fill="#087f72" text-anchor="middle">e₁</text><text x="238.0" y="284.0" font-size="16" font-weight="400" fill="#087f72" text-anchor="middle">e₂</text><text x="298.0" y="284.0" font-size="16" font-weight="400" fill="#087f72" text-anchor="middle">…</text><text x="358.0" y="284.0" font-size="16" font-weight="400" fill="#087f72" text-anchor="middle">e₁₀₂₄</text><rect x="148" y="295" width="240" height="34" fill="#f4f6f8" stroke="#d3dce2"/><text x="138" y="318.0" font-size="16" font-weight="400" fill="#63717d" text-anchor="end">43</text><rect x="148" y="329" width="240" height="34" fill="#f4f6f8" stroke="#d3dce2"/><text x="138" y="352.0" font-size="16" font-weight="400" fill="#63717d" text-anchor="end">…</text><rect x="148" y="363" width="240" height="34" fill="#f4f6f8" stroke="#d3dce2"/><text x="138" y="386.0" font-size="16" font-weight="400" fill="#63717d" text-anchor="end">319,999</text><text x="24" y="282" font-size="25" font-weight="700" fill="#172b39" text-anchor="start">ID 42</text><path d="M88 278H142" fill="none" stroke="#087f72" stroke-width="2.5" marker-end="url(#arrow)"/><text x="148" y="429" font-size="20" font-weight="650" fill="#172b39" text-anchor="start">全表：625 MiB</text><path d="M390 278H405V479H210V501" fill="none" stroke="#087f72" stroke-width="2.5" marker-end="url(#arrow)"/><text x="24" y="458" font-size="20" font-weight="650" fill="#172b39" text-anchor="start">取出索引 42 对应的行</text><rect x="24" y="507" width="364" height="44" rx="3" fill="#dbf4ed" stroke="#087f72" stroke-width="2"/><path d="M115.0 507v44" stroke="#087f72" stroke-opacity=".35"/><path d="M206.0 507v44" stroke="#087f72" stroke-opacity=".35"/><path d="M297.0 507v44" stroke="#087f72" stroke-opacity=".35"/><text x="69.5" y="535.0" font-size="16" font-weight="400" fill="#087f72" text-anchor="middle">e₁</text><text x="160.5" y="535.0" font-size="16" font-weight="400" fill="#087f72" text-anchor="middle">e₂</text><text x="251.5" y="535.0" font-size="16" font-weight="400" fill="#087f72" text-anchor="middle">…</text><text x="342.5" y="535.0" font-size="16" font-weight="400" fill="#087f72" text-anchor="middle">e₁₀₂₄</text><text x="24" y="586" font-size="23" font-weight="650" fill="#087f72" text-anchor="start">1,024 × 2 Bytes = 2 KiB</text><path d="M210 605V631" fill="none" stroke="#087f72" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="90" y="637" width="240" height="46" rx="4" fill="#fff" stroke="#63717d"/><text x="210" y="667" font-size="19" font-weight="400" fill="#172b39" text-anchor="middle">Transformer 主干</text><path d="M24 715H396" stroke="#d3dce2"/><text x="24" y="748" font-size="20" font-weight="650" fill="#172b39" text-anchor="start">只把表的行数增加 10 倍</text><text x="24" y="783" font-size="20" font-weight="400" fill="#172b39" text-anchor="start">全表：62.5 → 625 MiB</text><text x="24" y="810" font-size="20" font-weight="400" fill="#172b39" text-anchor="start">选中行：2 → 2 KiB</text><text x="24" y="856" font-size="15" font-weight="400" fill="#63717d" text-anchor="start">固定维度 1,024 与 BF16，按原始数据计。</text><text x="24" y="878" font-size="15" font-weight="400" fill="#63717d" text-anchor="start">缓存与存储位置还会影响实际访存和延迟。</text></g></svg>
