<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" lang="zh-CN" role="img" aria-labelledby="title desc"><title id="title">625 MiB 的表，返回 2 KiB 的向量</title><desc id="desc">token ID 42 选中嵌入表的一行，取出的向量送入 Transformer。固定维度和精度时，增加表行数只改变全表存储量。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#087f72"/></marker></defs><rect width="1040" height="620" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans CJK SC,sans-serif" fill="#172b39"><text x="36" y="45" font-size="30" font-weight="700" fill="#172b39" text-anchor="start">625 MiB 的表，返回 2 KiB 的向量</text><text x="36" y="81" font-size="19" font-weight="400" fill="#172b39" text-anchor="start">一次输入查表：token ID 决定取哪一行，向量维度决定这一行有多大。</text><text x="230" y="128" font-size="19" font-weight="650" fill="#172b39" text-anchor="start">320,000 行 × 1,024 列</text><rect x="230" y="147" width="310" height="40" fill="#f4f6f8" stroke="#d3dce2"/><text x="220" y="173.0" font-size="16" font-weight="400" fill="#63717d" text-anchor="end">…</text><rect x="230" y="187" width="310" height="40" fill="#f4f6f8" stroke="#d3dce2"/><text x="220" y="213.0" font-size="16" font-weight="400" fill="#63717d" text-anchor="end">41</text><rect x="230" y="227" width="310" height="40" rx="3" fill="#dbf4ed" stroke="#087f72" stroke-width="2"/><path d="M307.5 227v40" stroke="#087f72" stroke-opacity=".35"/><path d="M385.0 227v40" stroke="#087f72" stroke-opacity=".35"/><path d="M462.5 227v40" stroke="#087f72" stroke-opacity=".35"/><text x="268.75" y="253.0" font-size="16" font-weight="400" fill="#087f72" text-anchor="middle">e₁</text><text x="346.25" y="253.0" font-size="16" font-weight="400" fill="#087f72" text-anchor="middle">e₂</text><text x="423.75" y="253.0" font-size="16" font-weight="400" fill="#087f72" text-anchor="middle">…</text><text x="501.25" y="253.0" font-size="16" font-weight="400" fill="#087f72" text-anchor="middle">e₁₀₂₄</text><rect x="230" y="267" width="310" height="40" fill="#f4f6f8" stroke="#d3dce2"/><text x="220" y="293.0" font-size="16" font-weight="400" fill="#63717d" text-anchor="end">43</text><rect x="230" y="307" width="310" height="40" fill="#f4f6f8" stroke="#d3dce2"/><text x="220" y="333.0" font-size="16" font-weight="400" fill="#63717d" text-anchor="end">…</text><rect x="230" y="347" width="310" height="40" fill="#f4f6f8" stroke="#d3dce2"/><text x="220" y="373.0" font-size="16" font-weight="400" fill="#63717d" text-anchor="end">319,999</text><text x="36" y="218" font-size="18" font-weight="400" fill="#172b39" text-anchor="start">token ID</text><text x="36" y="253" font-size="32" font-weight="700" fill="#172b39" text-anchor="start">42</text><path d="M98 247H218" fill="none" stroke="#087f72" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M548 247H660" fill="none" stroke="#087f72" stroke-width="2.5" marker-end="url(#arrow)"/><text x="677" y="198" font-size="22" font-weight="650" fill="#172b39" text-anchor="start">取出索引 42 对应的行</text><rect x="677" y="227" width="320" height="40" rx="3" fill="#dbf4ed" stroke="#087f72" stroke-width="2"/><path d="M757.0 227v40" stroke="#087f72" stroke-opacity=".35"/><path d="M837.0 227v40" stroke="#087f72" stroke-opacity=".35"/><path d="M917.0 227v40" stroke="#087f72" stroke-opacity=".35"/><text x="717.0" y="253.0" font-size="16" font-weight="400" fill="#087f72" text-anchor="middle">e₁</text><text x="797.0" y="253.0" font-size="16" font-weight="400" fill="#087f72" text-anchor="middle">e₂</text><text x="877.0" y="253.0" font-size="16" font-weight="400" fill="#087f72" text-anchor="middle">…</text><text x="957.0" y="253.0" font-size="16" font-weight="400" fill="#087f72" text-anchor="middle">e₁₀₂₄</text><text x="677" y="307" font-size="20" font-weight="400" fill="#172b39" text-anchor="start">1,024 个 BF16 数值</text><text x="677" y="342" font-size="22" font-weight="650" fill="#087f72" text-anchor="start">1,024 × 2 Bytes = 2 KiB</text><path d="M835 357V383" fill="none" stroke="#087f72" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="710" y="390" width="250" height="46" rx="4" fill="#fff" stroke="#63717d"/><text x="835" y="420" font-size="20" font-weight="400" fill="#172b39" text-anchor="middle">Transformer 主干</text><text x="230" y="424" font-size="17" font-weight="400" fill="#172b39" text-anchor="start">全表：320,000 × 1,024 × 2 Bytes</text><text x="230" y="459" font-size="25" font-weight="650" fill="#172b39" text-anchor="start">= 625 MiB</text><path d="M36 487H1004" stroke="#d3dce2"/><text x="36" y="520" font-size="20" font-weight="650" fill="#172b39" text-anchor="start">只把行数增加 10 倍</text><text x="36" y="556" font-size="24" font-weight="400" fill="#172b39" text-anchor="start">32,000 → 320,000</text><text x="405" y="520" font-size="19" font-weight="400" fill="#172b39" text-anchor="start">全表存储</text><text x="405" y="556" font-size="24" font-weight="650" fill="#172b39" text-anchor="start">62.5 → 625 MiB</text><text x="770" y="520" font-size="19" font-weight="400" fill="#172b39" text-anchor="start">选中的向量</text><text x="770" y="556" font-size="24" font-weight="650" fill="#087f72" text-anchor="start">2 → 2 KiB</text><text x="36" y="601" font-size="15" font-weight="400" fill="#63717d" text-anchor="start">固定维度 1,024 与 BF16，按原始数据计。缓存与存储位置还会影响实际访存和延迟。</text></g></svg>
